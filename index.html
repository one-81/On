<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ativação UniTV - Planos e Downloads</title>
    <style>
        :root {
            --primary: #e60000; /* Mudado de amarelo para vermelho intenso */
            --secondary: #1a1a1a;
            --bg: #0d0d0d;
            --text: #ffffff;
            --success: #25d366;
            --primary-light: #ff3333; /* Vermelho mais claro para hover */
        }

        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 80px; }
        .container { max-width: 900px; margin: auto; padding: 20px; text-align: center; }
        
        /* Banner e Chamada */
        .hero { background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://tvbr.ovh/fundo.jpg'); background-size: cover; padding: 40px 20px; border-bottom: 2px solid var(--primary); }
        h1 { color: var(--primary); margin: 10px 0; font-size: 28px; }
        
        /* Cards de Planos (Atualizado para Vermelho) */
        .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin: 40px 0; }
        .plan-card { background: var(--secondary); border: 1px solid #333; border-radius: 15px; padding: 20px; position: relative; transition: 0.3s; }
        .plan-card.popular { border: 2px solid var(--primary); transform: scale(1.05); }
        .badge { background: var(--primary); color: #fff; padding: 5px 10px; border-radius: 5px; font-weight: bold; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); font-size: 12px; }
        .price { font-size: 32px; font-weight: bold; margin: 15px 0; color: var(--primary); }
        .features { list-style: none; padding: 0; text-align: left; margin: 20px 0; }
        .features li { margin: 10px 0; font-size: 14px; }
        .btn-select { display: block; background: var(--primary); color: #fff; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold; transition: 0.2s; }
        .btn-select:hover { background: var(--primary-light); }
        .pix-info { font-size: 11px; color: #aaa; margin-top: 10px; display: block; }

        /* Seção Compatibilidade (COM ÍCONES E VERMELHO) */
        .compatibility { background: #161616; padding: 25px; border-radius: 15px; margin: 30px 0; border-left: 5px solid var(--primary); }
        .comp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; text-align: left; margin-top: 15px; align-items: start; }
        
        /* Estilização dos Itens de Compatibilidade */
        .comp-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
